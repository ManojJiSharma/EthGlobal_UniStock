[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer_runs = 200
via_ir = true
ffi = true
evm_version = "cancun"
bytecode_hash = "none"
allow_internal_expect_revert = true

[profile.default.fuzz]
runs = 1000
seed = "0x1234"

[profile.debug]
via_ir = false
optimizer_runs = 200
fuzz.runs = 100

[rpc_endpoints]
rootstock_testnet = "${ROOTSTOCK_TESTNET_RPC_URL}"
rootstock_mainnet = "${ROOTSTOCK_MAINNET_RPC_URL}"

[etherscan]
rskTestnet = { key = "${ETHERSCAN_API_KEY}", url = "https://rootstock-testnet.blockscout.com/api" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
